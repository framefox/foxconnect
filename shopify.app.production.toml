# Production Configuration for Framefox Connect
# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "577282c9e39381d671a61a5b68ff125b"
name = "Framefox Connect"
application_url = "https://connect.framefox.com"
embedded = false

[access_scopes]
# Scopes required for drop-shipping functionality - minimum required scopes
scopes = "read_products,write_products,read_orders,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders,write_fulfillments,read_assigned_fulfillment_orders,write_assigned_fulfillment_orders,write_inventory,read_inventory,read_locations,write_locations"

[auth]
redirect_urls = [
  "https://connect.framefox.com/connections/auth/shopify/callback"
]

[webhooks]
api_version = "2026-10"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks/app/uninstalled"

[[webhooks.subscriptions]]
topics = ["orders/create"]
uri = "/webhooks/orders/create"

[[webhooks.subscriptions]]
topics = ["products/create"]
uri = "/webhooks/products/create"

[[webhooks.subscriptions]]
topics = ["products/update"]
uri = "/webhooks/products/update"

# GDPR compliance webhooks (required for App Store distribution)
[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request"]
uri = "/webhooks/customers/data_request"

[[webhooks.subscriptions]]
compliance_topics = ["customers/redact"]
uri = "/webhooks/customers/redact"

[[webhooks.subscriptions]]
compliance_topics = ["shop/redact"]
uri = "/webhooks/shop/redact"

[pos]
embedded = false

[build]
# IMPORTANT: Set to false for production to prevent automatic URL updates
automatically_update_urls_on_dev = false
dev_store_url = ""
[[webhooks.subscriptions]]
topics = ["products/delete"]
uri = "/webhooks/products/delete"

[[webhooks.subscriptions]]
topics = ["fulfillment_orders/fulfillment_request_submitted"]
uri = "/webhooks/fulfillment_orders/fulfillment_request_submitted"

[[webhooks.subscriptions]]
topics = ["fulfillment_orders/cancellation_request_submitted"]
uri = "/webhooks/fulfillment_orders/cancellation_request_submitted"
